<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen flex font-poppins">
    <div class="flex-1 w-full flex flex-col xl:ml-64">
      <header class="p-4 h-[72px] flex items-center justify-between w-full">
        <div class="flex items-center sm:gap-4 gap-2">
          <button class="xl:hidden" id="navToggle">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <h1 class="text-xl font-semibold">Hoşgeldin, Eteyit</h1>
        </div>

        <div class="flex items-center gap-4">
          <!-- Desktop search input with its icon -->
          <div class="relative hidden md:block">
            <input
              type="text"
              placeholder="Ara"
              class="w-[308px] pl-11 pr-4 py-2 bg-white rounded-[14px] border-[1px] border-[#ECECEC] font-poppins text-sm font-normal leading-[21px]"
            />
            <svg
              class="absolute left-[18px] top-1/2 -translate-y-1/2"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M14 14L10 10M11.3333 6.66667C11.3333 9.244 9.244 11.3333 6.66667 11.3333C4.08934 11.3333 2 9.244 2 6.66667C2 4.08934 4.08934 2 6.66667 2C9.244 2 11.3333 4.08934 11.3333 6.66667Z"
                stroke="#999999"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <!-- Mobile search button -->
          <button class="md:hidden" id="mobileSearchBtn">
            <svg
              class="w-5 h-5"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </button>

          <!-- Bell icon -->
          <button>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
              />
            </svg>
          </button>

          <!-- Profile image and arrow (keeping at the end) -->
          <div class="flex gap-2">
            <img
              src="./assests/logo.jpg"
              class="h-[36px] w-[36px]"
              alt="Eteyit Logo"
            />
            <button class="p-0">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Search Overlay -->
      <div
        id="searchOverlay"
        class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"
      >
        <div class="w-full bg-white shadow-lg">
          <div class="container mx-auto px-4 py-3">
            <div class="relative">
              <input
                type="text"
                id="searchInput"
                placeholder="Arama yap"
                class="w-full pl-11 pr-4 py-2 bg-white rounded-[14px] border-[1px] border-[#EFF3FA] font-poppins text-sm font-normal leading-[21px] placeholder:text-sm placeholder:font-normal placeholder:leading-[21px] placeholder:font-poppins"
              />
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 absolute left-[18px] top-1/2 -translate-y-1/2 text-gray-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <button
                id="closeSearch"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <main class="p-6">
        <section
          class="py-4 px-[24px] flex-1 bg-[#F9F9F9] rounded-[16px] section-settings-profile"
        >
          <!-- Contact Information Container -->
          <div class="space-y-[12px] p-[24px]">
            <!-- E-posta -->
            <div
              class="h-[56px] bg-white border border-[#EFF3FA] rounded-[8px] py-[8px] px-[16px]"
            >
              <label class="flex flex-col">
                <span
                  class="font-poppins text-[12px] leading-[16px] font-normal text-[#667085]"
                >
                  E-posta
                </span>
                <input
                  type="email"
                  placeholder="destek@geldimarket.com"
                  class="w-full font-poppins text-[16px] leading-[24px] font-normal text-[#344054] placeholder:text-[#344054] focus:outline-none"
                />
              </label>
            </div>

            <!-- Telefon Numarası -->
            <div
              class="h-[56px] bg-white border border-[#EFF3FA] rounded-[8px] py-[8px] px-[16px]"
            >
              <label class="flex flex-col">
                <span
                  class="font-poppins text-[12px] leading-[16px] font-normal text-[#667085]"
                >
                  Telefon Numarası
                </span>
                <input
                  type="tel"
                  placeholder="+055555512452"
                  class="w-full font-poppins text-[16px] leading-[24px] font-normal text-[#344054] placeholder:text-[#344054] focus:outline-none"
                />
              </label>
            </div>

            <!-- Adres -->
            <div
              class="h-[56px] bg-white border border-[#EFF3FA] rounded-[8px] py-[8px] px-[16px]"
            >
              <label class="flex flex-col">
                <span
                  class="font-poppins text-[12px] leading-[16px] font-normal text-[#667085]"
                >
                  Adres
                </span>
                <input
                  type="text"
                  placeholder="cevizli mahallesi ....."
                  class="w-full font-poppins text-[16px] leading-[24px] font-normal text-[#344054] placeholder:text-[#344054] focus:outline-none"
                />
              </label>
            </div>

            <!-- Şehir -->
            <div
              class="h-[56px] bg-white border border-[#EFF3FA] rounded-[8px] py-[8px] px-[16px]"
            >
              <label class="flex flex-col">
                <span
                  class="font-poppins text-[12px] leading-[16px] font-normal text-[#667085]"
                >
                  Şehir
                </span>
                <input
                  type="text"
                  placeholder="İstanbul"
                  class="w-full font-poppins text-[16px] leading-[24px] font-normal text-[#344054] placeholder:text-[#344054] focus:outline-none"
                />
              </label>
            </div>

            <!-- Ülke -->
            <div
              class="h-[56px] bg-white border border-[#EFF3FA] rounded-[8px] py-[8px] px-[16px]"
            >
              <label class="flex flex-col">
                <span
                  class="font-poppins text-[12px] leading-[16px] font-normal text-[#667085]"
                >
                  Ülke
                </span>
                <input
                  type="text"
                  placeholder="Türkiye"
                  class="w-full font-poppins text-[16px] leading-[24px] font-normal text-[#344054] placeholder:text-[#344054] focus:outline-none"
                />
              </label>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-[12px] mt-6">
              <button
                class="px-[24px] py-[8px] rounded-[124px] bg-[#111] text-white font-poppins text-[14px] leading-[24px]"
              >
                Kaydet ve Yayınla
              </button>
              <button
                class="px-[24px] py-[8px] rounded-[124px] bg-[#DF2E2E80] text-[#fff] font-poppins text-[14px] leading-[24px]"
              >
                Vazgeç
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      document
        .querySelectorAll('.settings-profile-box button')
        .forEach((button) => {
          button.addEventListener('click', () => {
            const content = button.nextElementSibling;
            const isOpen = !content.classList.contains('hidden');

            // Close all other sections
            document
              .querySelectorAll('.settings-profile-box button + div')
              .forEach((div) => {
                div.classList.add('hidden');
              });

            // Toggle current section
            if (!isOpen) {
              content.classList.remove('hidden');
            }

            // Rotate only the arrow icon (last svg in button)
            const arrow = button.querySelector('svg:last-child');
            document
              .querySelectorAll('.settings-profile-box button svg:last-child')
              .forEach((svg) => {
                svg.style.transform = 'rotate(0deg)';
              });
            if (!isOpen) {
              arrow.style.transform = 'rotate(180deg)';
            }
          });
        });
    </script>
  </body>
</html>
