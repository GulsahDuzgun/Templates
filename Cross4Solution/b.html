<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'be-vietnam': ['"Be Vietnam Pro"', 'sans-serif'],
              poppins: ['Poppins', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <!-- Add Be Vietnam Pro font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500&display=swap"
      rel="stylesheet"
    />
    <!-- Add Prata font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Prata&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex font-poppins">
    <div class="flex-1 w-full flex flex-col xl:ml-64">
      <main class="p-6">
        <!-- Payment Information Form -->

        <div class="bg-[#F8F8F8] rounded-[16px] py-8 px-12 mb-6">
          <h2
            class="font-['Prata'] text-[16px] leading-[21.68px] text-[#111] font-normal mb-4"
          >
            Ödeme Bilgileri
          </h2>
          <form>
            <div class="space-y-4">
              <!-- Card Number Input -->
              <div
                class="w-full px-4 py-2 flex gap-4 items-center justify-between rounded-[6px] bg-[#fff]"
              >
                <label
                  class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                >
                  Kart Numarası
                </label>
                <div class="relative flex-1">
                  <input
                    type="text"
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                    placeholder="**** **** **** ****"
                  />
                </div>
              </div>

              <!-- Expiration Date and CVV -->
              <div class="grid sm:grid-cols-4 grid-cols-1 gap-4">
                <div
                  class="w-full flex flex-col px-4 py-2 rounded-[6px] bg-[#fff]"
                >
                  <label
                    class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                  >
                    Kart Sahibi
                  </label>
                  <input
                    type="text"
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                    placeholder="Ersin Sağlam"
                  />
                </div>
                <div
                  class="w-full flex flex-col px-4 py-2 rounded-[6px] bg-[#fff]"
                >
                  <label
                    class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                  >
                    Ay
                  </label>
                  <input
                    type="text"
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                    placeholder="00"
                  />
                </div>
                <div
                  class="w-full flex flex-col px-4 py-2 rounded-[6px] bg-[#fff]"
                >
                  <label
                    class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                  >
                    Yıl
                  </label>
                  <input
                    type="text"
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                    placeholder="00"
                  />
                </div>
                <div
                  class="w-full flex flex-col px-4 py-2 rounded-[6px] bg-[#fff]"
                >
                  <label
                    class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                  >
                    CVC
                  </label>
                  <input
                    type="text"
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                    placeholder="000"
                  />
                </div>
              </div>
            </div>
          </form>
          <div class="mt-4 flex items-center gap-2">
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M9 1.5C13.1423 1.5 16.5 4.85775 16.5 9C16.5016 10.9691 15.7287 12.8598 14.3482 14.264C12.9677 15.6681 11.0904 16.473 9.12152 16.5049C7.15267 16.5369 5.25025 15.7932 3.825 14.4345C2.39974 13.0758 1.56599 11.2111 1.50375 9.243L1.5 9L1.503 8.79C1.614 4.74525 4.9275 1.5 9 1.5ZM9 8.25H8.25L8.16225 8.25525C7.97996 8.27693 7.81196 8.36472 7.69006 8.50197C7.56816 8.63923 7.50084 8.81643 7.50084 9C7.50084 9.18357 7.56816 9.36077 7.69006 9.49803C7.81196 9.63528 7.97996 9.72307 8.16225 9.74475L8.25 9.75V12L8.25525 12.0878C8.27499 12.2552 8.35056 12.411 8.46976 12.5302C8.58896 12.6494 8.74484 12.725 8.91225 12.7448L9 12.75H9.75L9.83775 12.7448C10.0052 12.725 10.161 12.6494 10.2802 12.5302C10.3994 12.411 10.475 12.2552 10.4948 12.0878L10.5 12L10.4948 11.9123C10.4768 11.7592 10.4122 11.6155 10.3097 11.5005C10.2072 11.3855 10.0717 11.3048 9.92175 11.2695L9.83775 11.2545L9.75 11.25V9L9.74475 8.91225C9.72501 8.74484 9.64944 8.58896 9.53024 8.46976C9.41104 8.35056 9.25516 8.27499 9.08775 8.25525L9 8.25ZM9.0075 6L8.91225 6.00525C8.72996 6.02693 8.56196 6.11472 8.44006 6.25197C8.31816 6.38923 8.25084 6.56643 8.25084 6.75C8.25084 6.93357 8.31816 7.11077 8.44006 7.24803C8.56196 7.38528 8.72996 7.47307 8.91225 7.49475L9 7.5L9.09525 7.49475C9.27754 7.47307 9.44554 7.38528 9.56744 7.24803C9.68934 7.11077 9.75666 6.93357 9.75666 6.75C9.75666 6.56643 9.68934 6.38923 9.56744 6.25197C9.44554 6.11472 9.27754 6.02693 9.09525 6.00525L9.0075 6Z"
                fill="#999999"
              />
            </svg>

            <h3
              class="font-poppins text-[12px] leading-[18px] font-normal text-[#888888]"
            >
              Güvenlik amacıyla, kimliğinizi ve ödeme bilgilerinizi doğrulamak
              için geçici bir ödeme alacağız.
            </h3>
          </div>
        </div>

        <!-- Address Form -->
        <div class="bg-[#F8F8F8] rounded-[16px] py-8 px-12">
          <h2
            class="font-['Prata'] text-[16px] leading-[21.68px] text-[#111] font-normal mb-4"
          >
            Fatura Adresi
          </h2>
          <form>
            <div class="space-y-4">
              <!-- Name Input -->
              <div
                class="w-full flex gap-4 items-center px-4 py-2 rounded-[6px] bg-[#fff]"
              >
                <label
                  class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                >
                  Ad
                </label>
                <input
                  type="text"
                  class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                  placeholder="Ersin"
                />
              </div>

              <!-- Surname Input -->
              <div
                class="w-full gap-4 items-center px-4 py-2 rounded-[6px] bg-[#fff]"
              >
                <label
                  class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                >
                  Soyad
                </label>
                <input
                  type="text"
                  class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                  placeholder="Soğlam"
                />
              </div>

              <div class="flex sm:flex-row flex-col w-full gap-4">
                <!-- Country Selection -->
                <div class="w-full px-4 py-2 rounded-[6px] bg-[#fff]">
                  <label
                    class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                  >
                    Ülke
                  </label>
                  <select
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] focus:outline-none"
                  >
                    <option>Türkiye</option>
                  </select>
                </div>

                <!-- City Selection -->
                <div class="w-full px-4 py-2 rounded-[6px] bg-[#fff]">
                  <label
                    class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                  >
                    Şehir
                  </label>
                  <select
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] focus:outline-none"
                  >
                    <option>İstanbul</option>
                  </select>
                </div>

                <!-- Postal Code -->
                <div class="w-full px-4 py-2 rounded-[6px] bg-[#fff]">
                  <label
                    class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888]"
                  >
                    Posta Kodu
                  </label>
                  <input
                    type="text"
                    class="w-full bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none"
                    placeholder="34000"
                  />
                </div>
              </div>
              <!-- Address -->
              <div
                class="w-full flex gap-4 items-center px-4 py-2 rounded-[6px] bg-[#fff]"
              >
                <label
                  class="block font-poppins text-[12px] leading-[18px] font-medium text-[#888888] whitespace-nowrap"
                >
                  Açık Adres
                </label>
                <textarea
                  class="w-full h-[42px] bg-[#fff] font-poppins text-[14px] leading-[21px] font-medium text-[#111] placeholder:font-poppins placeholder:text-[14px] placeholder:text-[#111] placeholder:leading-[21px] placeholder:font-medium focus:outline-none resize-none py-[10px]"
                  placeholder="Adresiniz..."
                ></textarea>
              </div>
            </div>
          </form>
        </div>

        <!-- Submit Button -->
        <div class="mt-6 flex justify-end">
          <button class="px-9 py-3 bg-[#111] text-white rounded-[8px]">
            İlerle
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
