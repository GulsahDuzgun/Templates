<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'be-vietnam': ['"Be Vietnam Pro"', 'sans-serif'],
              poppins: ['Poppins', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <!-- Add Be Vietnam Pro font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen flex font-poppins">
    <div class="flex-1 w-full flex flex-col xl:ml-64">
      <main class="p-6">
        <!-- Partner section -->
        <div class="mx-auto">
          <p
            class="text-[14px] text-[#020D23] leading-[21px] tracking-[0%] font-medium text-center mb-8"
          >
            Bizi Tercih Eden Tedarikçilerimiz
          </p>

          <!-- Partner logos grid -->
          <div
            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-x-4 sm:gap-x-6 gap-y-4 items-center justify-items-center"
          >
            <img
              src="assests/pamukkale.png"
              alt="Pamukkale"
              class="h-[76px] w-auto max-w-[100px]"
            />
            <img
              src="assests/watsons.png"
              alt="Watsons"
              class="h-[76px] w-auto max-w-[100px]"
            />
            <img
              src="assests/mediaMark.png"
              alt="Media Markt"
              class="h-[76px] w-auto max-w-[100px]"
            />
            <img
              src="assests/trendyol.png"
              alt="Trendyol"
              class="h-[76px] w-auto max-w-[100px]"
            />
            <img
              src="assests/carrefour.png"
              alt="Carrefour"
              class="h-[76px] w-auto max-w-[100px]"
            />
            <img
              src="assests/lc-waikiki.png"
              alt="LC Waikiki"
              class="h-[76px] w-auto max-w-[100px]"
            />
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
