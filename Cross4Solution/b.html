      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {

    <!-- Add Be Vietnam Pro font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="min-h-screen flex font-poppins">

      <main class="p-6"></main>
